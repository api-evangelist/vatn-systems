aid: vatn-systems
name: Vatn Systems
description: >-
  Vatn Systems is a Bristol, Rhode Island defense technology company founded in 2023 that designs and
  manufactures low-cost, modular autonomous underwater vehicles (UUVs/AUVs) and the autonomy, navigation
  and acoustic-processing software that runs on them. Its product line spans the Skelmir S6 (6-inch,
  man-portable, swarm-capable) and Skelmir S12 (12.75-inch medium-class) vehicles, Eyra 5.1 and Eyra 8.0
  passive hydrophone arrays, and four software systems - INStinct (maritime inertial navigation for
  GPS-denied operation), PARse (embedded acoustic signal processing on ARM), FUSE (multi-sensor tracking,
  distributed as a Docker image) and AEsir (TAK-native sensor fusion and mission planning). Mission
  planning is delivered through an ATAK/CivTAK/MilTAK/WinTAK plugin and Fathom, a browser-based mission
  planner and vehicle configurator. Vatn raised a $60M Series A in December 2025 (total funding $76.5M)
  and acquired Crewless Marine. It publishes no public developer portal, API reference or machine-readable
  contract; every integration surface is reached through a demo request or supplier form.
